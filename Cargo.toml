[package]
name = "mtx-slipstream"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "High-performance serialization for Matrix Client-Server and Federation APIs. Eliminates redundant serialize/deserialize round-trips in sync and send_join responses."

[dependencies]
bytes = { workspace = true }
itoa = "1"
ryu = "1"
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
simd-json = { workspace = true, features = ["std_impl"] }
thiserror = { workspace = true }

[lints]
workspace = true
