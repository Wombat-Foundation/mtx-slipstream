[package]
name = "mtx-slipstream"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
description = "High-performance serialization for hottest Matrix federation and C2S endpoints."
keywords = ["matrix", "federation", "C2S"]
categories = ["http", "optimization"]
repository = "https://github.com/Wombat-Foundation/mtx-slipstream"
readme = "README.md"
autobenches = false

# This repository is consumed as a Git submodule, but it owns its dependency
# resolution and lockfile. Declaring an explicit workspace stops Cargo from
# inheriting the enclosing superproject's workspace when invoked from here.
[workspace]

[features]
default = ["x-matrix"]
mimalloc = ["dep:mimalloc"]
nightly-benches = []
x-matrix = ["dep:headers"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
bytes = "1.10.1"
ed25519-consensus = { version = "2.1", default-features = false }
headers = { version = "0.4.2", optional = true }
http = "1.3.1"
# Only ever used by the `#[global_allocator]` in the bench binaries
# (feature-gated so a plain `cargo build`/`cargo test` never compiles or
# links it into the library). It's a regular optional dependency rather
# than a dev-dependency specifically so it can be selected at bench time
# via `cargo bench --features mimalloc` -- dev-dependencies can't be
# optional in Cargo.
mimalloc = { version = "0.1", optional = true, default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
rezzy = { git = "https://gitlab.com/gamesguru/rezzy.git", branch = "alpha", features = ["signing-core"] }

[lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"

# High-Value Security & Robustness restrictions
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"

[profile.release]
strip = "symbols"
lto = "thin"

# Optimize for quick edit/compile cycles. Full debug info makes artifacts much
# larger and slows linking; use a debug build with symbols only when needed.
[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

[profile.test]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256
