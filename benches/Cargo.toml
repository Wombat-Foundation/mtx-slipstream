[package]
name = "mtx-slipstream-benches"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
bench = []
serde-comparison = ["dep:serde_json"]
mimalloc-alloc = ["dep:mimalloc"]
nightly-benches = []

[dependencies]
bytes = "1.10.1"
mimalloc = { version = "0.1", optional = true, default-features = false }
mtx-slipstream = { path = ".." }
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }
simd-json = { version = "0.18", default-features = false, features = ["runtime-detection", "swar-number-parsing"] }

[[bench]]
name = "serialization"
path = "serialization.rs"
required-features = ["bench"]

[[bench]]
name = "serde_cmp"
path = "serde_cmp.rs"
required-features = ["bench", "serde-comparison"]
