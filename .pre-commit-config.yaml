default_install_hook_types:
    - pre-commit
    - commit-msg

default_stages:
    - pre-commit

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-yaml
          - id: check-toml
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: mixed-line-ending
          - id: check-merge-conflict
          - id: check-added-large-files

    - repo: https://github.com/crate-ci/typos
      rev: v1.45.2
      hooks:
          - id: typos
          - id: typos
            name: commit-msg-typos
            stages: [commit-msg]

    - repo: local
      hooks:
          - id: cargo-fmt
            name: cargo fmt
            entry: cargo fmt --all --
            language: system
            types: [rust]
            stages: [pre-commit]

          - id: cargo-clippy
            name: cargo clippy
            entry: cargo clippy --all-targets -- -D warnings
            language: system
            types: [rust]
            stages: [pre-commit]

          - id: cargo-test
            name: cargo test
            entry: cargo test --all-targets
            language: system
            types: [rust]
            stages: [pre-commit]
            pass_filenames: false
